name: Pin npm
description: Install the npm version declared by the root packageManager field

runs:
  using: composite
  steps:
    - name: Install pinned npm
      shell: bash
      run: |
        npm_spec="$(node -p 'require("./package.json").packageManager')"
        if [[ "$npm_spec" != npm@* ]]; then
          echo "Expected packageManager to contain an npm spec, got: $npm_spec" >&2
          exit 1
        fi
        npm install --global "$npm_spec"
        npm --version
